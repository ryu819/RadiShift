services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: myapp_development
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  app:
    build:
      context: ./backend
    command: bash
    environment:
      APP_HOST: localhost:3000
      GOOGLE_CLIENT_ID: 805388227113-dkoianm0ormcdrcb8cop5iqtdol0n1nv.apps.googleusercontent.com
    volumes:
      - ./backend:/backend
    ports:
      - 3000:3000
    depends_on:
      - db
    tty: true
    stdin_open: true
  front:
      build:
        context: ./frontend
      command: bash
      tty: true
      stdin_open: true
      volumes:
        - ./frontend:/frontend
        - /frontend/node_modules
      ports:
        - "8000:3000"
volumes:
  mysql_data: